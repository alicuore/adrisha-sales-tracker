name: Publish sales correction

run-name: Correct ${{ inputs.session_id }} to ${{ inputs.new_gmv_cents }} cents

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Existing session ID (example: 2026-09-14-s01)'
        required: true
        type: string
      new_gmv_cents:
        description: 'Correct sales in cents, no RM/comma (example: 430595)'
        required: true
        type: string
      expected_monthly_total_cents:
        description: 'Expected new month total in cents (example: 7406513)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-sales-correction
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish correction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SESSION_ID: ${{ inputs.session_id }}
      NEW_GMV_CENTS: ${{ inputs.new_gmv_cents }}
      EXPECTED_TOTAL_CENTS: ${{ inputs.expected_monthly_total_cents }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Run this publisher from the main branch only.'
          exit 1

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply the one-field correction
        run: node scripts/update-session-gmv.mjs "$SESSION_ID" "$NEW_GMV_CENTS" "$EXPECTED_TOTAL_CENTS"

      - name: Confirm only the current month JSON changed
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only)
          if [[ ${#changed_files[@]} -ne 1 || ! "${changed_files[0]}" =~ ^data/[0-9]{4}/[0-9]{2}-[a-z]+\.json$ ]]; then
            printf '::error::Expected one monthly JSON change; found: %s\n' "${changed_files[*]:-(none)}"
            exit 1
          fi

      - name: Validate production JSON
        run: node tests/validate-data.mjs

      - name: Run all 18 tests
        run: node --test tests/*.test.mjs

      - name: Commit and push the validated correction
        shell: bash
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo '::error::main changed while this correction was running. Run the workflow again with the latest total.'
            exit 1
          fi

          mapfile -t changed_files < <(git diff --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed_files[0]}"
          git commit -m "Correct ${SESSION_ID} sales to ${NEW_GMV_CENTS} cents"
          git push origin HEAD:main
